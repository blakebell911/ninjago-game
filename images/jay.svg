<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bgj" x1="0" y1="0" x2="0.3" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="bgGlowJ" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0d1a50" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <!-- hat: deep navy/indigo blue -->
    <linearGradient id="hatTop" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3a4ab0"/>
      <stop offset="55%" stop-color="#222888"/>
      <stop offset="100%" stop-color="#101450"/>
    </linearGradient>
    <radialGradient id="hatLit" cx="38%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#5566cc" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#1a2070" stop-opacity="0"/>
    </radialGradient>
    <!-- hat brim: slightly darker -->
    <linearGradient id="hatBrim" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2a3498"/>
      <stop offset="100%" stop-color="#0e1258"/>
    </linearGradient>
    <!-- face mask: near-black dark blue -->
    <linearGradient id="maskG" x1="0" y1="0" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a1e38"/>
      <stop offset="100%" stop-color="#0a0c1e"/>
    </linearGradient>
    <!-- gi body: royal blue -->
    <linearGradient id="giG" x1="0" y1="0" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2a44c8"/>
      <stop offset="100%" stop-color="#101a70"/>
    </linearGradient>
    <!-- gi hi -->
    <linearGradient id="giHi" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3a58d8"/>
      <stop offset="100%" stop-color="#1a28a0"/>
    </linearGradient>
    <!-- gold -->
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e8c848"/>
      <stop offset="100%" stop-color="#9a7010"/>
    </linearGradient>
    <!-- red eye glow -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#aa0000"/>
    </radialGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="200" height="280" fill="url(#bgj)" rx="14"/>
  <rect width="200" height="280" fill="url(#bgGlowJ)" rx="14"/>
  <!-- dark building silhouette hint (matching show background) -->
  <rect x="0"   y="150" width="45"  height="80" fill="#0a0a14" fill-opacity="0.60"/>
  <rect x="155" y="160" width="45"  height="70" fill="#0a0a14" fill-opacity="0.55"/>
  <rect x="0"   y="170" width="30"  height="60" fill="#0a0a14" fill-opacity="0.45"/>
  <!-- card border -->
  <rect x="1" y="1" width="198" height="278" fill="none" stroke="#3a50cc" stroke-opacity="0.55" stroke-width="2" rx="13"/>

  <!-- ── GI BODY ── -->
  <path d="M0,220 L0,184 Q18,165 45,157 L74,150 Q87,148 100,147 Q113,148 126,150 L155,157 Q182,165 200,184 L200,220 Z"
        fill="url(#giG)"/>
  <!-- gi left shoulder section -->
  <path d="M45,157 Q32,150 26,140 Q34,138 42,144 L54,154 Z" fill="url(#giHi)"/>
  <!-- gi right shoulder -->
  <path d="M155,157 Q168,150 174,140 Q166,138 158,144 L146,154 Z" fill="url(#giHi)"/>

  <!-- DIAGONAL GOLD SASH (key detail from the image) -->
  <!-- main sash band going from left shoulder to right hip -->
  <path d="M52,152 Q80,158 110,170 Q130,176 150,178 L148,184 Q126,182 106,176 Q76,164 48,158 Z"
        fill="url(#goldG)" fill-opacity="0.90"/>
  <!-- sash chain/link decoration -->
  <ellipse cx="72"  cy="158" rx="4" ry="3" fill="#c8a030" fill-opacity="0.70"/>
  <ellipse cx="86"  cy="162" rx="4" ry="3" fill="#c8a030" fill-opacity="0.70"/>
  <ellipse cx="100" cy="166" rx="4" ry="3" fill="#c8a030" fill-opacity="0.70"/>
  <ellipse cx="114" cy="170" rx="4" ry="3" fill="#c8a030" fill-opacity="0.70"/>
  <ellipse cx="128" cy="174" rx="4" ry="3" fill="#c8a030" fill-opacity="0.70"/>
  <!-- second thinner sash stripe -->
  <path d="M56,156 Q84,162 114,174 Q132,180 152,182 L151,178 Q130,176 112,170 Q82,158 54,152 Z"
        fill="#a07820" fill-opacity="0.55"/>

  <!-- gi chest detail lines -->
  <path d="M75,152 Q88,158 100,160 Q112,158 125,152" stroke="#1a2888" stroke-width="1.5" fill="none" stroke-opacity="0.70"/>
  <path d="M70,160 Q85,166 100,168 Q115,166 130,160" stroke="#1a2888" stroke-width="1" fill="none" stroke-opacity="0.55"/>
  <!-- gi fold lines -->
  <line x1="56"  y1="158" x2="48"  y2="210" stroke="#1a2480" stroke-width="1.2" stroke-opacity="0.50"/>
  <line x1="144" y1="158" x2="152" y2="210" stroke="#1a2480" stroke-width="1.2" stroke-opacity="0.50"/>

  <!-- gold shoulder pad accent -->
  <path d="M26,140 Q22,132 26,126 Q30,133 32,140 Z" fill="url(#goldG)" fill-opacity="0.80"/>
  <path d="M174,140 Q178,132 174,126 Q170,133 168,140 Z" fill="url(#goldG)" fill-opacity="0.80"/>

  <!-- ── NECK / FACE MASK base ── -->
  <rect x="82" y="142" width="36" height="20" fill="url(#maskG)" rx="3"/>

  <!-- ── FACE (entirely covered by dark mask — only eyes visible) ── -->
  <!-- head/mask area -->
  <rect x="50" y="90" width="100" height="60" fill="url(#maskG)" rx="8"/>
  <!-- mask fabric folds (subtle lines for cloth texture) -->
  <path d="M58,100 Q56,118 58,130"  stroke="#252840" stroke-width="1.5" fill="none" stroke-opacity="0.60"/>
  <path d="M66,96 Q64,115 66,128"   stroke="#252840" stroke-width="1" fill="none" stroke-opacity="0.45"/>
  <path d="M142,100 Q144,118 142,130" stroke="#252840" stroke-width="1.5" fill="none" stroke-opacity="0.60"/>
  <path d="M134,96 Q136,115 134,128"  stroke="#252840" stroke-width="1" fill="none" stroke-opacity="0.45"/>
  <!-- diagonal cloth folds across face -->
  <path d="M55,108 Q100,112 145,108" stroke="#1e2238" stroke-width="1.2" fill="none" stroke-opacity="0.50"/>
  <path d="M52,118 Q100,122 148,118" stroke="#1e2238" stroke-width="1" fill="none" stroke-opacity="0.40"/>

  <!-- ── GLOWING RED EYES (the key feature) ── -->
  <!-- eye glow bloom -->
  <ellipse cx="78"  cy="108" rx="18" ry="9" fill="#ff0000" fill-opacity="0.18"/>
  <ellipse cx="122" cy="108" rx="18" ry="9" fill="#ff0000" fill-opacity="0.18"/>
  <!-- eye dark socket -->
  <rect x="62" y="101" width="30" height="14" fill="#080810" rx="3"/>
  <rect x="108" y="101" width="30" height="14" fill="#080810" rx="3"/>
  <!-- glowing red eye lenses -->
  <rect x="64" y="103" width="26" height="10" fill="url(#eyeGlow)" rx="2"/>
  <rect x="110" y="103" width="26" height="10" fill="url(#eyeGlow)" rx="2"/>
  <!-- eye inner bright core -->
  <rect x="68" y="105" width="18" height="6" fill="#ff8888" rx="1"/>
  <rect x="114" y="105" width="18" height="6" fill="#ff8888" rx="1"/>
  <!-- eye highlight flare -->
  <rect x="66" y="104" width="6" height="4" fill="white" fill-opacity="0.55" rx="1"/>
  <rect x="112" y="104" width="6" height="4" fill="white" fill-opacity="0.55" rx="1"/>

  <!-- ── ROGUE HAT (big blue dome with wide flat brim — the S3/4 look) ── -->
  <!-- Hat brim: wide flat ellipse sitting on top of the head -->
  <ellipse cx="100" cy="94" rx="68" ry="10" fill="url(#hatBrim)"/>
  <!-- brim top edge highlight -->
  <ellipse cx="100" cy="92" rx="67" ry="7" fill="#3040a8" fill-opacity="0.50"/>
  <!-- brim underside shadow -->
  <ellipse cx="100" cy="96" rx="67" ry="8" fill="#06082a" fill-opacity="0.55"/>

  <!-- Hat dome: rounded dome sitting on top of brim -->
  <ellipse cx="100" cy="56" rx="54" ry="42" fill="url(#hatTop)"/>
  <ellipse cx="100" cy="56" rx="54" ry="42" fill="url(#hatLit)"/>
  <!-- dome fabric folds / creases radiating from crown -->
  <path d="M100,18 Q94,40 90,66" stroke="#1a2278" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>
  <path d="M100,18 Q106,40 110,66" stroke="#1a2278" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>
  <path d="M100,18 Q80,38 68,62"  stroke="#1a2278" stroke-width="1.2" fill="none" stroke-opacity="0.42"/>
  <path d="M100,18 Q120,38 132,62" stroke="#1a2278" stroke-width="1.2" fill="none" stroke-opacity="0.42"/>
  <path d="M100,18 Q66,32 54,56"  stroke="#1a2278" stroke-width="1" fill="none" stroke-opacity="0.32"/>
  <path d="M100,18 Q134,32 146,56" stroke="#1a2278" stroke-width="1" fill="none" stroke-opacity="0.32"/>
  <!-- dome top centre highlight -->
  <ellipse cx="94" cy="36" rx="20" ry="14" fill="#5568d8" fill-opacity="0.38"/>
  <!-- dome shadow on sides -->
  <ellipse cx="58"  cy="56" rx="18" ry="36" fill="#080c30" fill-opacity="0.30"/>
  <ellipse cx="142" cy="56" rx="18" ry="36" fill="#080c30" fill-opacity="0.22"/>

  <!-- ── INFO BAR ── -->
  <rect x="0" y="220" width="200" height="60" fill="#000000" fill-opacity="0.72"/>
  <rect x="0" y="220" width="200" height="3" fill="#3a50cc" fill-opacity="0.70"/>
  <rect x="10" y="226" width="42" height="14" fill="#2030aa" fill-opacity="0.30" rx="7"/>
  <text x="31" y="236" font-size="8" text-anchor="middle" fill="#8899ee" font-family="sans-serif" font-weight="bold">S3 / S4</text>
  <text x="100" y="252" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="sans-serif">Jay</text>
  <text x="100" y="270" font-size="11" text-anchor="middle" fill="#8899ee" fill-opacity="0.90" font-family="sans-serif">Ninja of Lightning</text>
</svg>
