<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#090c1e"/>
      <stop offset="100%" stop-color="#03040b"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#141d54" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#03040b" stop-opacity="0"/>
    </radialGradient>
    <!-- Hat dome: deep royal blue lit from upper-left -->
    <radialGradient id="hatDome" cx="32%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#5270dc"/>
      <stop offset="38%" stop-color="#2638a8"/>
      <stop offset="100%" stop-color="#070c34"/>
    </radialGradient>
    <!-- Brim top surface -->
    <linearGradient id="brimTop" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2e42b8"/>
      <stop offset="100%" stop-color="#131a68"/>
    </linearGradient>
    <!-- Brim underside -->
    <linearGradient id="brimUnder" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#090c3c"/>
      <stop offset="100%" stop-color="#030510"/>
    </linearGradient>
    <!-- Face mask: near-black dark navy -->
    <radialGradient id="mask" cx="50%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#1a1e38"/>
      <stop offset="100%" stop-color="#070810"/>
    </radialGradient>
    <!-- Gi: saturated royal blue -->
    <linearGradient id="gi" x1="0.1" y1="0" x2="0.9" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2c4ed0"/>
      <stop offset="55%" stop-color="#16269c"/>
      <stop offset="100%" stop-color="#070e50"/>
    </linearGradient>
    <linearGradient id="giLit" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3858e0"/>
      <stop offset="100%" stop-color="#1c30b8"/>
    </linearGradient>
    <!-- Gold sash -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f2d462"/>
      <stop offset="55%" stop-color="#caa420"/>
      <stop offset="100%" stop-color="#845e0e"/>
    </linearGradient>
    <!-- Gold rail (slightly darker for depth) -->
    <linearGradient id="goldRail" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d4a818"/>
      <stop offset="100%" stop-color="#7a5208"/>
    </linearGradient>
    <!-- Eye red glow -->
    <radialGradient id="eyeR" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ff7070"/>
      <stop offset="55%" stop-color="#ee0000"/>
      <stop offset="100%" stop-color="#880000"/>
    </radialGradient>
    <!-- Eye bloom red cast on mask -->
    <radialGradient id="eyeBloom" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff1800" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff1800" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="200" height="280" fill="url(#bg)" rx="14"/>
  <rect width="200" height="280" fill="url(#bgGlow)" rx="14"/>
  <!-- building silhouettes -->
  <rect x="0"   y="156" width="36" height="74" fill="#050709" fill-opacity="0.88"/>
  <rect x="4"   y="142" width="20" height="18" fill="#050709" fill-opacity="0.88"/>
  <rect x="164" y="161" width="36" height="69" fill="#050709" fill-opacity="0.88"/>
  <rect x="170" y="146" width="20" height="18" fill="#050709" fill-opacity="0.88"/>
  <!-- warm lantern glow -->
  <ellipse cx="174" cy="174" rx="20" ry="9" fill="#bf4e10" fill-opacity="0.16"/>
  <ellipse cx="26"  cy="180" rx="14" ry="7" fill="#bf4e10" fill-opacity="0.11"/>
  <!-- card border -->
  <rect x="1" y="1" width="198" height="278" fill="none" stroke="#3248c8" stroke-opacity="0.65" stroke-width="2" rx="13"/>

  <!-- ── BODY / GI ── -->
  <path d="M0,222 L0,184 Q20,162 48,154 L76,148 Q88,145 100,145 Q112,145 124,148 L152,154 Q180,162 200,184 L200,222 Z"
        fill="url(#gi)"/>
  <!-- chest lit centre panel -->
  <path d="M76,148 Q88,145 100,145 Q112,145 124,148 L118,168 Q108,164 100,163 Q92,164 82,168 Z"
        fill="url(#giLit)"/>
  <!-- left shoulder pad -->
  <path d="M48,154 Q32,146 25,134 Q34,132 43,140 L56,152 Z" fill="url(#giLit)"/>
  <path d="M25,134 Q17,124 21,116 Q27,126 31,134 Z" fill="#0c1468"/>
  <!-- right shoulder pad -->
  <path d="M152,154 Q168,146 175,134 Q166,132 157,140 L144,152 Z" fill="url(#giLit)"/>
  <path d="M175,134 Q183,124 179,116 Q173,126 169,134 Z" fill="#0c1468"/>
  <!-- gi fold lines -->
  <path d="M54,156 Q50,177 52,214" stroke="#0c1474" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>
  <path d="M64,152 Q62,175 64,214" stroke="#0c1474" stroke-width="1" fill="none" stroke-opacity="0.40"/>
  <path d="M146,156 Q150,177 148,214" stroke="#0c1474" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>
  <path d="M136,152 Q138,175 136,214" stroke="#0c1474" stroke-width="1" fill="none" stroke-opacity="0.40"/>

  <!-- ── GOLD CHAIN-LADDER SASH ── -->
  <!-- Upper rail -->
  <path d="M44,147 Q88,158 126,170 Q143,176 161,181 L162,175 Q144,170 127,164 Q89,152 45,141 Z"
        fill="url(#goldRail)"/>
  <!-- Lower rail -->
  <path d="M46,162 Q90,173 128,185 Q145,191 163,196 L164,190 Q146,185 129,179 Q91,167 47,156 Z"
        fill="url(#goldRail)"/>
  <!-- Bright rung fills (vertical bars crossing between rails) -->
  <rect x="59"  y="145" width="5" height="18" fill="url(#gold)" rx="1" transform="rotate(-14 61 154)"/>
  <rect x="73"  y="150" width="5" height="18" fill="url(#gold)" rx="1" transform="rotate(-14 75 159)"/>
  <rect x="87"  y="155" width="5" height="18" fill="url(#gold)" rx="1" transform="rotate(-14 89 164)"/>
  <rect x="101" y="160" width="5" height="18" fill="url(#gold)" rx="1" transform="rotate(-14 103 169)"/>
  <rect x="115" y="165" width="5" height="18" fill="url(#gold)" rx="1" transform="rotate(-14 117 174)"/>
  <rect x="129" y="170" width="5" height="18" fill="url(#gold)" rx="1" transform="rotate(-14 131 179)"/>
  <rect x="143" y="175" width="5" height="18" fill="url(#gold)" rx="1" transform="rotate(-14 145 184)"/>
  <!-- Bright upper sash accent line -->
  <path d="M48,143 Q92,154 130,166 Q147,172 164,177 L163,173 Q146,168 129,162 Q91,150 47,139 Z"
        fill="#f0d060" fill-opacity="0.55"/>

  <!-- gi centre motif -->
  <path d="M84,150 Q100,147 116,150 Q110,160 100,162 Q90,160 84,150 Z" fill="#1428a0" fill-opacity="0.48"/>
  <polygon points="100,150 96,156 100,160 104,156" fill="#c8a820" fill-opacity="0.65"/>

  <!-- ── NECK ── -->
  <rect x="84" y="137" width="32" height="12" fill="url(#mask)" rx="4"/>

  <!-- ── HEAD FACE MASK ── -->
  <!-- head shadow -->
  <ellipse cx="100" cy="108" rx="60" ry="52" fill="#000008" fill-opacity="0.52"/>
  <!-- main head block -->
  <rect x="45" y="73" width="110" height="70" fill="url(#mask)" rx="10"/>
  <!-- mask cloth fold lines — vertical drape -->
  <path d="M53,81 Q51,108 53,136" stroke="#26284a" stroke-width="1.8" fill="none" stroke-opacity="0.60"/>
  <path d="M63,77 Q61,106 63,134" stroke="#26284a" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
  <path d="M147,81 Q149,108 147,136" stroke="#26284a" stroke-width="1.8" fill="none" stroke-opacity="0.60"/>
  <path d="M137,77 Q139,106 137,134" stroke="#26284a" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
  <!-- horizontal cloth wrap lines -->
  <path d="M47,90  Q100,94  153,90"  stroke="#20243e" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <path d="M47,104 Q100,108 153,104" stroke="#20243e" stroke-width="1.0" fill="none" stroke-opacity="0.45"/>
  <path d="M47,118 Q100,122 153,118" stroke="#20243e" stroke-width="0.9" fill="none" stroke-opacity="0.38"/>
  <path d="M47,128 Q100,131 153,128" stroke="#20243e" stroke-width="0.8" fill="none" stroke-opacity="0.32"/>
  <!-- side shadow strips -->
  <rect x="45" y="73" width="16" height="70" fill="#040612" fill-opacity="0.40" rx="10"/>
  <rect x="139" y="73" width="16" height="70" fill="#040612" fill-opacity="0.30" rx="10"/>

  <!-- ── RED GLOWING EYES ── -->
  <!-- bloom / light cast on mask -->
  <ellipse cx="77"  cy="106" rx="25" ry="14" fill="url(#eyeBloom)"/>
  <ellipse cx="123" cy="106" rx="25" ry="14" fill="url(#eyeBloom)"/>
  <!-- socket recess -->
  <rect x="58" y="99" width="37" height="14" fill="#020206" rx="4"/>
  <rect x="105" y="99" width="37" height="14" fill="#020206" rx="4"/>
  <!-- glowing red lens -->
  <rect x="60" y="101" width="33" height="10" fill="url(#eyeR)" rx="3"/>
  <rect x="107" y="101" width="33" height="10" fill="url(#eyeR)" rx="3"/>
  <!-- bright hotspot core -->
  <rect x="63" y="103" width="22" height="6" fill="#ffaaaa" rx="2" fill-opacity="0.82"/>
  <rect x="110" y="103" width="22" height="6" fill="#ffaaaa" rx="2" fill-opacity="0.82"/>
  <!-- specular flare top-left of lens -->
  <rect x="61" y="101" width="8" height="3" fill="white" fill-opacity="0.56" rx="1"/>
  <rect x="108" y="101" width="8" height="3" fill="white" fill-opacity="0.56" rx="1"/>

  <!-- ── ROGUE HAT ── -->

  <!-- BRIM underside / shadow below brim edge -->
  <ellipse cx="100" cy="80" rx="78" ry="13" fill="url(#brimUnder)"/>
  <!-- BRIM top surface (flat wide disc) -->
  <ellipse cx="100" cy="76" rx="78" ry="11" fill="url(#brimTop)"/>
  <!-- Brim highlight (front-lit edge) -->
  <ellipse cx="100" cy="74" rx="60" ry="5" fill="#4458cc" fill-opacity="0.46"/>
  <!-- Brim outer rim -->
  <ellipse cx="100" cy="76" rx="78" ry="11" fill="none" stroke="#121e68" stroke-width="1.8"/>

  <!-- DOME base shape -->
  <ellipse cx="100" cy="42" rx="58" ry="38" fill="url(#hatDome)"/>

  <!-- DOME SEGMENT SHADOWS — alternating darker wedge panels between crease lines -->
  <!-- These give the ribbed/pumpkin look from the reference image -->
  <!-- Left-outer panel (dark) -->
  <path d="M100,8 Q44,14 36,48 Q40,52 46,48 Q52,18 100,12 Z" fill="#060b2c" fill-opacity="0.30"/>
  <!-- Left-mid panel (dark) -->
  <path d="M100,8 Q68,12 58,48 Q64,52 70,48 Q76,16 100,10 Z" fill="#060b2c" fill-opacity="0.26"/>
  <!-- Left-inner panel (dark) -->
  <path d="M100,8 Q92,10 88,46 Q94,48 98,46 Q100,12 100,8 Z" fill="#060b2c" fill-opacity="0.20"/>
  <!-- Right-outer panel (dark) -->
  <path d="M100,8 Q156,14 164,48 Q160,52 154,48 Q148,18 100,12 Z" fill="#060b2c" fill-opacity="0.30"/>
  <!-- Right-mid panel (dark) -->
  <path d="M100,8 Q132,12 142,48 Q136,52 130,48 Q124,16 100,10 Z" fill="#060b2c" fill-opacity="0.26"/>
  <!-- Right-inner panel (dark) -->
  <path d="M100,8 Q108,10 112,46 Q106,48 102,46 Q100,12 100,8 Z" fill="#060b2c" fill-opacity="0.20"/>

  <!-- DOME crease lines (prominent, defining the ribs) -->
  <path d="M100,6 Q96,30 94,74"  stroke="#08104e" stroke-width="2.8" fill="none" stroke-opacity="0.72"/>
  <path d="M100,6 Q104,30 106,74" stroke="#08104e" stroke-width="2.8" fill="none" stroke-opacity="0.72"/>
  <path d="M100,6 Q80,20 68,62"  stroke="#08104e" stroke-width="2.4" fill="none" stroke-opacity="0.66"/>
  <path d="M100,6 Q120,20 132,62" stroke="#08104e" stroke-width="2.4" fill="none" stroke-opacity="0.66"/>
  <path d="M100,6 Q62,14 50,52"  stroke="#08104e" stroke-width="2.0" fill="none" stroke-opacity="0.58"/>
  <path d="M100,6 Q138,14 150,52" stroke="#08104e" stroke-width="2.0" fill="none" stroke-opacity="0.58"/>
  <path d="M100,6 Q46,12 38,46"  stroke="#08104e" stroke-width="1.6" fill="none" stroke-opacity="0.44"/>
  <path d="M100,6 Q154,12 162,46" stroke="#08104e" stroke-width="1.6" fill="none" stroke-opacity="0.44"/>

  <!-- Panel center highlights (lit top of each rib) -->
  <path d="M100,6 Q76,16 64,56"  stroke="#4462d8" stroke-width="1.0" fill="none" stroke-opacity="0.38"/>
  <path d="M100,6 Q124,16 136,56" stroke="#4462d8" stroke-width="1.0" fill="none" stroke-opacity="0.38"/>
  <path d="M100,6 Q92,16 90,54"  stroke="#4462d8" stroke-width="0.8" fill="none" stroke-opacity="0.28"/>
  <path d="M100,6 Q108,16 110,54" stroke="#4462d8" stroke-width="0.8" fill="none" stroke-opacity="0.28"/>

  <!-- Cross-curve stitching lines for fabric depth -->
  <path d="M50,26 Q100,20 150,26" stroke="#1c2c96" stroke-width="1.0" fill="none" stroke-opacity="0.44"/>
  <path d="M42,44 Q100,38 158,44" stroke="#1c2c96" stroke-width="0.9" fill="none" stroke-opacity="0.36"/>
  <path d="M42,58 Q100,54 158,58" stroke="#1c2c96" stroke-width="0.8" fill="none" stroke-opacity="0.28"/>

  <!-- Dome top highlight -->
  <ellipse cx="86" cy="22" rx="28" ry="17" fill="#6878e8" fill-opacity="0.40"/>
  <ellipse cx="80" cy="17" rx="11" ry="8" fill="#9898ff" fill-opacity="0.27"/>

  <!-- Dark shadow band at dome base / brim junction -->
  <ellipse cx="100" cy="76" rx="58" ry="8" fill="#050828" fill-opacity="0.60"/>

  <!-- ── INFO BAR ── -->
  <rect x="0" y="222" width="200" height="58" fill="#000000" fill-opacity="0.78"/>
  <rect x="0" y="222" width="200" height="3" fill="#3248c8" fill-opacity="0.82"/>
  <rect x="10" y="228" width="42" height="14" fill="#1c2ca0" fill-opacity="0.35" rx="7"/>
  <text x="31" y="238" font-size="8" text-anchor="middle" fill="#7888e0" font-family="sans-serif" font-weight="bold">S3 / S4</text>
  <text x="100" y="253" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="sans-serif">Jay</text>
  <text x="100" y="271" font-size="11" text-anchor="middle" fill="#7888e0" fill-opacity="0.92" font-family="sans-serif">Ninja of Lightning</text>
</svg>
