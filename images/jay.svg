<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <!-- dark night background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0e1228"/>
      <stop offset="100%" stop-color="#04050e"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#1a2260" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#04050e" stop-opacity="0"/>
    </radialGradient>
    <!-- hat dome: deep royal blue, lit from top-left -->
    <radialGradient id="hatDome" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#4a5ecc"/>
      <stop offset="45%" stop-color="#2a38a0"/>
      <stop offset="100%" stop-color="#0c1040"/>
    </radialGradient>
    <!-- hat brim top surface -->
    <linearGradient id="brimTop" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3040b0"/>
      <stop offset="100%" stop-color="#181e6a"/>
    </linearGradient>
    <!-- hat brim underside (darker) -->
    <linearGradient id="brimUnder" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0e1248"/>
      <stop offset="100%" stop-color="#060820"/>
    </linearGradient>
    <!-- face mask: near-black with slight blue -->
    <radialGradient id="mask" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#22263e"/>
      <stop offset="100%" stop-color="#0a0c18"/>
    </radialGradient>
    <!-- gi: saturated royal blue -->
    <linearGradient id="gi" x1="0.1" y1="0" x2="0.9" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2e50d8"/>
      <stop offset="50%" stop-color="#1a2ea0"/>
      <stop offset="100%" stop-color="#0a1458"/>
    </linearGradient>
    <!-- gi highlight for shoulder/chest lit areas -->
    <linearGradient id="giLit" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4060e8"/>
      <stop offset="100%" stop-color="#1e38b8"/>
    </linearGradient>
    <!-- gold sash -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c8a020"/>
      <stop offset="100%" stop-color="#886010"/>
    </linearGradient>
    <!-- gold dark (shadow side of sash) -->
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#b08818"/>
      <stop offset="100%" stop-color="#604808"/>
    </linearGradient>
    <!-- eye glow red -->
    <radialGradient id="eyeR" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ff6666"/>
      <stop offset="60%" stop-color="#dd0000"/>
      <stop offset="100%" stop-color="#880000"/>
    </radialGradient>
    <!-- eye bloom (light cast on face) -->
    <radialGradient id="eyeBloom" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2200" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="200" height="280" fill="url(#bg)" rx="14"/>
  <rect width="200" height="280" fill="url(#bgGlow)" rx="14"/>
  <!-- building roofline silhouettes -->
  <rect x="0"   y="155" width="38" height="75" fill="#08090f" fill-opacity="0.80"/>
  <rect x="2"   y="140" width="22" height="20" fill="#08090f" fill-opacity="0.80"/>
  <rect x="162" y="160" width="38" height="65" fill="#08090f" fill-opacity="0.80"/>
  <rect x="172" y="145" width="22" height="20" fill="#08090f" fill-opacity="0.80"/>
  <!-- warm distant glow (lanterns) -->
  <ellipse cx="172" cy="172" rx="22" ry="10" fill="#c05818" fill-opacity="0.14"/>
  <ellipse cx="28"  cy="178" rx="16" ry="8"  fill="#c05818" fill-opacity="0.10"/>
  <!-- card border -->
  <rect x="1" y="1" width="198" height="278" fill="none" stroke="#3a52d0" stroke-opacity="0.60" stroke-width="2" rx="13"/>

  <!-- ── BODY / GI ── -->
  <!-- main torso -->
  <path d="M0,220 L0,182 Q20,160 48,152 L76,146 Q88,143 100,143 Q112,143 124,146 L152,152 Q180,160 200,182 L200,220 Z"
        fill="url(#gi)"/>
  <!-- chest lit centre panel -->
  <path d="M76,146 Q88,143 100,143 Q112,143 124,146 L118,165 Q108,162 100,161 Q92,162 82,165 Z"
        fill="url(#giLit)"/>
  <!-- left shoulder raised pad -->
  <path d="M48,152 Q33,144 26,132 Q35,130 44,138 L56,150 Z" fill="url(#giLit)"/>
  <!-- left shoulder dark edge -->
  <path d="M26,132 Q18,122 22,114 Q28,124 32,132 Z" fill="#101870"/>
  <!-- right shoulder raised pad -->
  <path d="M152,152 Q167,144 174,132 Q165,130 156,138 L144,150 Z" fill="url(#giLit)"/>
  <path d="M174,132 Q182,122 178,114 Q172,124 168,132 Z" fill="#101870"/>

  <!-- gi fabric folds -->
  <path d="M54,154 Q50,174 52,210" stroke="#101878" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>
  <path d="M64,150 Q62,172 64,210" stroke="#101878" stroke-width="1"   fill="none" stroke-opacity="0.40"/>
  <path d="M146,154 Q150,174 148,210" stroke="#101878" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>
  <path d="M136,150 Q138,172 136,210" stroke="#101878" stroke-width="1"   fill="none" stroke-opacity="0.40"/>

  <!-- ── GOLD DIAGONAL SASH ── -->
  <!-- main sash band -->
  <path d="M46,152 Q78,162 112,174 Q132,180 155,184 L153,190 Q128,186 108,180 Q74,168 42,158 Z"
        fill="url(#gold)"/>
  <!-- sash shadow edge (lower) -->
  <path d="M42,158 Q74,168 108,180 Q128,186 153,190 L154,186 Q130,182 110,176 Q76,164 44,154 Z"
        fill="url(#goldDark)" fill-opacity="0.70"/>
  <!-- sash decorative segments / chain links -->
  <rect x="60"  y="155" width="9" height="6" fill="#e8c840" rx="2" transform="rotate(-18,64,158)"/>
  <rect x="76"  y="160" width="9" height="6" fill="#e8c840" rx="2" transform="rotate(-18,80,163)"/>
  <rect x="92"  y="165" width="9" height="6" fill="#e8c840" rx="2" transform="rotate(-18,96,168)"/>
  <rect x="108" y="170" width="9" height="6" fill="#e8c840" rx="2" transform="rotate(-18,112,173)"/>
  <rect x="124" y="175" width="9" height="6" fill="#e8c840" rx="2" transform="rotate(-18,128,178)"/>
  <!-- link connectors -->
  <line x1="69"  y1="157" x2="77"  y2="160" stroke="#c8a820" stroke-width="1.5"/>
  <line x1="85"  y1="162" x2="93"  y2="165" stroke="#c8a820" stroke-width="1.5"/>
  <line x1="101" y1="167" x2="109" y2="170" stroke="#c8a820" stroke-width="1.5"/>
  <line x1="117" y1="172" x2="125" y2="175" stroke="#c8a820" stroke-width="1.5"/>
  <!-- second thin sash stripe above -->
  <path d="M50,149 Q82,159 116,171 Q136,177 158,181 L157,177 Q134,173 114,167 Q80,155 48,145 Z"
        fill="#d4a818" fill-opacity="0.50"/>

  <!-- gi pattern detail on chest -->
  <path d="M82,148 Q100,145 118,148 Q112,156 100,158 Q88,156 82,148 Z" fill="#1828a0" fill-opacity="0.45"/>

  <!-- ── NECK ── -->
  <rect x="84" y="136" width="32" height="14" fill="url(#mask)" rx="4"/>

  <!-- ── HEAD / FACE MASK ── -->
  <!-- shadow behind head -->
  <ellipse cx="100" cy="108" rx="56" ry="48" fill="#000008" fill-opacity="0.55"/>
  <!-- main face block — LEGO square head fully wrapped in dark mask -->
  <rect x="46" y="72" width="108" height="72" fill="url(#mask)" rx="10"/>
  <!-- mask fabric cloth folds — diagonal drape lines -->
  <path d="M54,80  Q52,106 54,136" stroke="#2a2e48" stroke-width="1.8" fill="none" stroke-opacity="0.60"/>
  <path d="M64,76  Q62,104 64,134" stroke="#2a2e48" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
  <path d="M146,80  Q148,106 146,136" stroke="#2a2e48" stroke-width="1.8" fill="none" stroke-opacity="0.60"/>
  <path d="M136,76  Q138,104 136,134" stroke="#2a2e48" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
  <!-- horizontal cloth wrap lines -->
  <path d="M48,88  Q100,92  152,88"  stroke="#24283e" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <path d="M48,100 Q100,104 152,100" stroke="#24283e" stroke-width="1.0" fill="none" stroke-opacity="0.45"/>
  <path d="M48,114 Q100,118 152,114" stroke="#24283e" stroke-width="1.0" fill="none" stroke-opacity="0.40"/>
  <path d="M48,126 Q100,129 152,126" stroke="#24283e" stroke-width="0.8" fill="none" stroke-opacity="0.35"/>
  <!-- mask left side shadow -->
  <rect x="46" y="72" width="18" height="72" fill="#06081a" fill-opacity="0.40" rx="10"/>
  <!-- mask right side shadow -->
  <rect x="136" y="72" width="18" height="72" fill="#06081a" fill-opacity="0.30" rx="10"/>

  <!-- ── RED GLOWING EYES ── -->
  <!-- bloom light cast on face mask from eyes -->
  <ellipse cx="78"  cy="105" rx="22" ry="12" fill="url(#eyeBloom)"/>
  <ellipse cx="122" cy="105" rx="22" ry="12" fill="url(#eyeBloom)"/>
  <!-- eye socket recess -->
  <rect x="60" y="98" width="34" height="14" fill="#04040c" rx="4"/>
  <rect x="106" y="98" width="34" height="14" fill="#04040c" rx="4"/>
  <!-- glowing red lens -->
  <rect x="62" y="100" width="30" height="10" fill="url(#eyeR)" rx="3"/>
  <rect x="108" y="100" width="30" height="10" fill="url(#eyeR)" rx="3"/>
  <!-- bright core (hotspot) -->
  <rect x="65" y="102" width="20" height="6" fill="#ff9999" rx="2" fill-opacity="0.80"/>
  <rect x="111" y="102" width="20" height="6" fill="#ff9999" rx="2" fill-opacity="0.80"/>
  <!-- specular flare top-left of each lens -->
  <rect x="63" y="101" width="7" height="3" fill="white" fill-opacity="0.50" rx="1"/>
  <rect x="109" y="101" width="7" height="3" fill="white" fill-opacity="0.50" rx="1"/>

  <!-- ── ROGUE HAT — large blue dome with wide flat brim ── -->

  <!-- BRIM underside (visible as shadow below brim edge) -->
  <ellipse cx="100" cy="79" rx="72" ry="11" fill="url(#brimUnder)"/>
  <!-- BRIM top surface -->
  <ellipse cx="100" cy="76" rx="72" ry="10" fill="url(#brimTop)"/>
  <!-- brim top highlight (light catching front edge) -->
  <ellipse cx="100" cy="74" rx="55" ry="5" fill="#4858c8" fill-opacity="0.45"/>
  <!-- brim rim edge -->
  <ellipse cx="100" cy="76" rx="72" ry="10" fill="none" stroke="#1a2268" stroke-width="1.5"/>

  <!-- DOME (large rounded cap sitting on brim) -->
  <!-- dome main shape -->
  <ellipse cx="100" cy="40" rx="58" ry="44" fill="url(#hatDome)"/>
  <!-- dome side shadow — right -->
  <ellipse cx="148" cy="44" rx="20" ry="38" fill="#070a28" fill-opacity="0.38"/>
  <!-- dome side shadow — left (lighter, lit side) -->
  <ellipse cx="52"  cy="44" rx="16" ry="36" fill="#070a28" fill-opacity="0.18"/>
  <!-- dome top highlight ellipse -->
  <ellipse cx="88" cy="22" rx="28" ry="18" fill="#6070e0" fill-opacity="0.42"/>
  <!-- dome specular spot -->
  <ellipse cx="82" cy="18" rx="10" ry="7" fill="#9090ff" fill-opacity="0.28"/>

  <!-- DOME fabric fold lines radiating from crown -->
  <path d="M100,4 Q96,28 92,62"  stroke="#1a2278" stroke-width="2"   fill="none" stroke-opacity="0.60"/>
  <path d="M100,4 Q104,28 108,62" stroke="#1a2278" stroke-width="2"   fill="none" stroke-opacity="0.60"/>
  <path d="M100,4 Q80,22 66,56"  stroke="#1a2278" stroke-width="1.8" fill="none" stroke-opacity="0.50"/>
  <path d="M100,4 Q120,22 134,56" stroke="#1a2278" stroke-width="1.8" fill="none" stroke-opacity="0.50"/>
  <path d="M100,4 Q62,18 48,50"  stroke="#1a2278" stroke-width="1.4" fill="none" stroke-opacity="0.38"/>
  <path d="M100,4 Q138,18 152,50" stroke="#1a2278" stroke-width="1.4" fill="none" stroke-opacity="0.38"/>
  <path d="M100,4 Q46,14 38,44"  stroke="#1a2278" stroke-width="1"   fill="none" stroke-opacity="0.25"/>
  <path d="M100,4 Q154,14 162,44" stroke="#1a2278" stroke-width="1"   fill="none" stroke-opacity="0.25"/>
  <!-- cross-curve stitching lines for fabric depth -->
  <path d="M52,28 Q100,22 148,28" stroke="#2030a0" stroke-width="1"   fill="none" stroke-opacity="0.45"/>
  <path d="M44,46 Q100,40 156,46" stroke="#2030a0" stroke-width="0.9" fill="none" stroke-opacity="0.38"/>
  <path d="M44,58 Q100,54 156,58" stroke="#2030a0" stroke-width="0.8" fill="none" stroke-opacity="0.30"/>

  <!-- ── INFO BAR ── -->
  <rect x="0" y="220" width="200" height="60" fill="#000000" fill-opacity="0.75"/>
  <rect x="0" y="220" width="200" height="3" fill="#3a52d0" fill-opacity="0.80"/>
  <rect x="10" y="226" width="42" height="14" fill="#1e2ea8" fill-opacity="0.35" rx="7"/>
  <text x="31" y="236" font-size="8" text-anchor="middle" fill="#7a8ee8" font-family="sans-serif" font-weight="bold">S3 / S4</text>
  <text x="100" y="252" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="sans-serif">Jay</text>
  <text x="100" y="270" font-size="11" text-anchor="middle" fill="#7a8ee8" fill-opacity="0.92" font-family="sans-serif">Ninja of Lightning</text>
</svg>
