<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0c1a4a"/>
      <stop offset="100%" stop-color="#04080f"/>
    </linearGradient>
    <radialGradient id="elecglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a44ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#000010" stop-opacity="0"/>
    </radialGradient>
    <!-- face skin: warm yellow, lighter top-center, darker sides -->
    <linearGradient id="faceBase" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f8d040"/>
      <stop offset="50%" stop-color="#f0bc28"/>
      <stop offset="100%" stop-color="#c89010"/>
    </linearGradient>
    <!-- face highlight -->
    <radialGradient id="faceLit" cx="45%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffe85a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f0bc28" stop-opacity="0"/>
    </radialGradient>
    <!-- hat: dark navy with slight top highlight -->
    <linearGradient id="hatMain" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#18265a"/>
      <stop offset="100%" stop-color="#070e28"/>
    </linearGradient>
    <!-- hat band: slightly lighter -->
    <linearGradient id="hatBand" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1e2e60"/>
      <stop offset="100%" stop-color="#0c1840"/>
    </linearGradient>
    <!-- gi body -->
    <linearGradient id="gi" x1="0" y1="0" x2="0.3" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1e42b0"/>
      <stop offset="100%" stop-color="#0a1a58"/>
    </linearGradient>
    <!-- gi shoulder hi -->
    <linearGradient id="giHi" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#2855cc"/>
      <stop offset="100%" stop-color="#112880"/>
    </linearGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="200" height="280" fill="url(#bg)"/>
  <rect width="200" height="280" fill="url(#elecglow)"/>
  <!-- storm cloud shapes -->
  <ellipse cx="30"  cy="30"  rx="45" ry="18" fill="#0a1640" fill-opacity="0.70"/>
  <ellipse cx="170" cy="25"  rx="40" ry="16" fill="#0a1640" fill-opacity="0.60"/>
  <ellipse cx="100" cy="20"  rx="55" ry="14" fill="#0c1a48" fill-opacity="0.55"/>
  <!-- background lightning bolt -->
  <polygon points="155,5 145,38 156,38 146,72" fill="#4488ff" fill-opacity="0.18" transform="rotate(6,151,38)"/>
  <polygon points="44,10 36,36 46,36 38,62"   fill="#4488ff" fill-opacity="0.10" transform="rotate(-5,42,36)"/>

  <!-- card border -->
  <rect x="1" y="1" width="198" height="278" fill="none" stroke="#4878ee" stroke-opacity="0.50" stroke-width="2" rx="13"/>

  <!-- ── BODY / GI ── -->
  <!-- Main torso: wide trapezoidal gi fill at the bottom -->
  <path d="M0,220 L0,185 Q18,168 48,160 L78,154 Q90,151 100,151 Q110,151 122,154 L152,160 Q182,168 200,185 L200,220 Z"
        fill="url(#gi)"/>
  <!-- Left shoulder pad / raised edge -->
  <path d="M48,160 Q60,154 78,154 L72,168 Q58,168 46,174 Z" fill="url(#giHi)"/>
  <!-- Right shoulder pad -->
  <path d="M152,160 Q140,154 122,154 L128,168 Q142,168 154,174 Z" fill="url(#giHi)"/>
  <!-- Gi centre-line / collar V -->
  <path d="M88,151 L100,151 L112,151 L106,168 L100,176 L94,168 Z" fill="#09143e"/>
  <line x1="88"  y1="151" x2="100" y2="176" stroke="#2244aa" stroke-width="1.2" stroke-opacity="0.7"/>
  <line x1="112" y1="151" x2="100" y2="176" stroke="#2244aa" stroke-width="1.2" stroke-opacity="0.7"/>
  <!-- Chest lightning bolt emblem -->
  <polygon points="103,158 99,170 104,170 100,182 112,166 107,166 111,154" fill="#ffd820" fill-opacity="0.88"/>
  <!-- Gi fold lines for fabric depth -->
  <line x1="55"  y1="163" x2="68"  y2="210" stroke="#0a1640" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="145" y1="163" x2="132" y2="210" stroke="#0a1640" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- ── NECK ── -->
  <path d="M87,148 Q89,152 89,158 L111,158 Q111,152 113,148 Z" fill="#f0bc28"/>
  <!-- neck shadows -->
  <path d="M87,148 Q86,155 87,158 L89,158 Q89,152 89,148 Z" fill="#b08010" fill-opacity="0.55"/>
  <path d="M113,148 Q114,155 113,158 L111,158 Q111,152 113,148 Z" fill="#b08010" fill-opacity="0.55"/>

  <!-- ── HEAD (LEGO-style square with rounded corners) ── -->
  <!-- head shadow / depth ring behind head -->
  <rect x="48" y="57" width="106" height="100" fill="#020610" fill-opacity="0.40" rx="14"/>
  <!-- main face block -->
  <rect x="50" y="56" width="100" height="98" fill="url(#faceBase)" rx="13"/>
  <!-- face lit overlay (highlight centre-top) -->
  <rect x="50" y="56" width="100" height="98" fill="url(#faceLit)" rx="13"/>
  <!-- face side shadows: dark bands left and right for 3-D roundness -->
  <rect x="50" y="56" width="18" height="98" fill="#b07808" fill-opacity="0.30" rx="13"/>
  <rect x="132" y="56" width="18" height="98" fill="#b07808" fill-opacity="0.22" rx="13"/>
  <!-- chin shadow underneath -->
  <ellipse cx="100" cy="154" rx="32" ry="6" fill="#603800" fill-opacity="0.32"/>
  <!-- ear left -->
  <ellipse cx="52" cy="105" rx="6" ry="8" fill="#f0bc28"/>
  <ellipse cx="53" cy="105" rx="3.5" ry="5" fill="#c09010" fill-opacity="0.45"/>
  <!-- ear right -->
  <ellipse cx="148" cy="105" rx="6" ry="8" fill="#f0bc28"/>
  <ellipse cx="147" cy="105" rx="3.5" ry="5" fill="#c09010" fill-opacity="0.45"/>

  <!-- ── ROGUE HAT (Season 3 / 4) ── -->
  <!-- Hat main body: follows the rounded top of the LEGO head, straight bottom = forehead band line.
       Path mimics rx=13 rounded corners WITHOUT clipPath so GitHub renders it correctly. -->
  <!-- Top rounded-corner hat cap (covers crown + upper forehead zone) -->
  <path d="M63,56 Q50,56 50,69 L50,100 Q56,93 100,91 Q144,93 150,100 L150,69 Q150,56 137,56 Z"
        fill="url(#hatMain)"/>
  <!-- Forehead band: sits slightly forward / lower — the iconic rogue hat detail.
       Slightly wider than head for that wrapped-cloth look. -->
  <rect x="47" y="96" width="106" height="12" fill="url(#hatBand)" rx="4"/>
  <!-- Band lower edge highlight (where fabric meets skin) -->
  <path d="M47,108 Q50,105 100,104 Q150,105 153,108" stroke="#263a7a" stroke-width="1.8" fill="none"/>
  <!-- Band upper crease line -->
  <path d="M49,98 Q52,96 100,95 Q148,96 151,98" stroke="#2a3e7e" stroke-width="1" fill="none" stroke-opacity="0.6"/>
  <!-- Hat fabric texture / fold lines -->
  <path d="M63,62 Q64,75 63,90" stroke="#0f1e52" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <path d="M80,57 Q81,72 80,89" stroke="#0f1e52" stroke-width="0.9" fill="none" stroke-opacity="0.42"/>
  <path d="M120,57 Q119,72 120,89" stroke="#0f1e52" stroke-width="0.9" fill="none" stroke-opacity="0.42"/>
  <path d="M137,62 Q136,75 137,90" stroke="#0f1e52" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <!-- Top-centre highlight on hat (catches light) -->
  <ellipse cx="100" cy="65" rx="28" ry="7" fill="#2244aa" fill-opacity="0.28"/>
  <!-- Lightning bolt emblem stitched on hat front -->
  <polygon points="98,94 95,101 99,101 96,108 104,100 100,100 102,93" fill="#5599ff" fill-opacity="0.90"/>
  <polygon points="98,94 95,101 99,101 96,108 104,100 100,100 102,93" fill="none" stroke="#aaccff" stroke-width="0.7" stroke-opacity="0.55"/>
  <!-- Hat side wraps: dark fabric visible beside ears, going behind head -->
  <path d="M50,100 Q42,104 40,112 Q42,120 48,124 Q50,116 52,110 Z" fill="#0c1638"/>
  <path d="M150,100 Q158,104 160,112 Q158,120 152,124 Q150,116 148,110 Z" fill="#0c1638"/>
  <!-- Dark hair peeking below hat at sides -->
  <path d="M50,112 Q44,118 45,126 Q48,122 52,118 Z" fill="#150c00"/>
  <path d="M150,112 Q156,118 155,126 Q152,122 148,118 Z" fill="#150c00"/>
  <path d="M52,120 Q48,128 50,134 Q54,128 56,122 Z" fill="#120a00"/>
  <path d="M148,120 Q152,128 150,134 Q146,128 144,122 Z" fill="#120a00"/>

  <!-- ── FACE DETAILS (drawn on top so they show through) ── -->

  <!-- LEFT EYE -->
  <!-- white sclera -->
  <ellipse cx="79" cy="118" rx="13" ry="12" fill="white"/>
  <!-- iris (warm dark brown – Ninjago Jay style) -->
  <ellipse cx="79" cy="119" rx="9" ry="9" fill="#2a1800"/>
  <!-- pupil -->
  <ellipse cx="79" cy="119" rx="5" ry="5" fill="#0a0600"/>
  <!-- highlight -->
  <circle cx="83" cy="115" r="3.2" fill="white" fill-opacity="0.88"/>
  <circle cx="76" cy="122" r="1.4" fill="white" fill-opacity="0.40"/>
  <!-- eye outline -->
  <ellipse cx="79" cy="118" rx="13" ry="12" fill="none" stroke="#0a0600" stroke-width="1.8"/>
  <!-- upper eyelid line -->
  <path d="M66,113 Q79,109 92,113" stroke="#0a0600" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- RIGHT EYE -->
  <ellipse cx="121" cy="118" rx="13" ry="12" fill="white"/>
  <ellipse cx="121" cy="119" rx="9" ry="9" fill="#2a1800"/>
  <ellipse cx="121" cy="119" rx="5" ry="5" fill="#0a0600"/>
  <circle cx="125" cy="115" r="3.2" fill="white" fill-opacity="0.88"/>
  <circle cx="118" cy="122" r="1.4" fill="white" fill-opacity="0.40"/>
  <ellipse cx="121" cy="118" rx="13" ry="12" fill="none" stroke="#0a0600" stroke-width="1.8"/>
  <path d="M108,113 Q121,109 134,113" stroke="#0a0600" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- EYEBROWS – furrowed inward (determined S3/4 look) -->
  <path d="M64,107 Q72,104 88,107" stroke="#1a0c00" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M136,107 Q128,104 112,107" stroke="#1a0c00" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- NOSE – minimal Ninjago-style hint -->
  <path d="M96,133 Q95,137 97,139 Q100,141 103,139 Q105,137 104,133" stroke="#b08010" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- FRECKLES – Jay's signature trait -->
  <circle cx="85"  cy="126" r="2.2" fill="#c07808" fill-opacity="0.52"/>
  <circle cx="91"  cy="129" r="1.6" fill="#c07808" fill-opacity="0.42"/>
  <circle cx="115" cy="126" r="2.2" fill="#c07808" fill-opacity="0.52"/>
  <circle cx="109" cy="129" r="1.6" fill="#c07808" fill-opacity="0.42"/>

  <!-- MOUTH – slight confident smirk -->
  <path d="M86,142 Q100,149 114,142" stroke="#0a0600" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Corner upturn on right (smirk) -->
  <path d="M114,142 Q116,140 115,138" stroke="#0a0600" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- ── INFO BAR ── -->
  <rect x="0" y="220" width="200" height="60" fill="#000000" fill-opacity="0.65"/>
  <!-- top accent -->
  <rect x="0" y="220" width="200" height="3" fill="#4080ff" fill-opacity="0.55"/>
  <!-- season badge -->
  <rect x="10" y="226" width="42" height="14" fill="#2a55dd" fill-opacity="0.25" rx="7"/>
  <text x="31" y="236" font-size="8" text-anchor="middle" fill="#88aaff" font-family="sans-serif" font-weight="bold">S3 / S4</text>
  <!-- name -->
  <text x="100" y="252" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="sans-serif">Jay</text>
  <!-- tagline -->
  <text x="100" y="270" font-size="11" text-anchor="middle" fill="#a0c4ff" fill-opacity="0.88" font-family="sans-serif">Ninja of Lightning</text>
</svg>
