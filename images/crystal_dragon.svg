<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bgcd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4060"/>
      <stop offset="50%" stop-color="#0a2040"/>
      <stop offset="100%" stop-color="#200840"/>
    </linearGradient>
    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88eeff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cc88ff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="280" fill="url(#bgcd)" rx="14"/>
  <rect x="1" y="1" width="198" height="278" fill="none" stroke="url(#crystalGlow)" stroke-width="2" rx="13" opacity="0.6"/>
  <!-- Crystal shards background -->
  <polygon points="100,20 120,60 100,50 80,60" fill="url(#crystalGlow)" opacity="0.3" filter="url(#glow)"/>
  <polygon points="60,40 90,80 70,90 50,70" fill="#88eeff" opacity="0.2"/>
  <polygon points="140,40 170,70 150,90 110,80" fill="#cc88ff" opacity="0.2"/>
  <!-- Dragon body -->
  <text x="100" y="130" font-size="80" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">🐉</text>
  <!-- Crystal overlay shards -->
  <polygon points="85,80 100,60 115,80 100,95" fill="url(#crystalGlow)" opacity="0.35" filter="url(#glow)"/>
  <polygon points="75,110 88,95 95,112 82,120" fill="#88eeff" opacity="0.3"/>
  <polygon points="125,110 112,95 105,112 118,120" fill="#cc88ff" opacity="0.3"/>
  <!-- Bottom panel -->
  <rect x="0" y="190" width="200" height="90" fill="rgba(0,0,0,0.55)" rx="0"/>
  <rect x="0" y="268" width="200" height="12" fill="rgba(0,0,0,0.3)" rx="0"/>
  <text x="100" y="218" font-size="16" font-weight="bold" text-anchor="middle" fill="white" font-family="system-ui,sans-serif">Crystal Dragon</text>
  <text x="100" y="238" font-size="11" text-anchor="middle" fill="rgba(136,238,255,0.8)" font-family="system-ui,sans-serif">Lloyd's Crystal Form</text>
</svg>
