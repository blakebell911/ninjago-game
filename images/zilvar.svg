<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bgz" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <radialGradient id="glowz" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#8899cc" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#000010" stop-opacity="0"/>
    </radialGradient>
    <!-- white fur base -->
    <linearGradient id="furBase" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f4f6ff"/>
      <stop offset="60%" stop-color="#dce2f0"/>
      <stop offset="100%" stop-color="#b0b8d0"/>
    </linearGradient>
    <!-- fur shadow for depth -->
    <radialGradient id="furLit" cx="45%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#dce2f0" stop-opacity="0"/>
    </radialGradient>
    <!-- armour -->
    <linearGradient id="armour" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d8dff0"/>
      <stop offset="100%" stop-color="#7888aa"/>
    </linearGradient>
    <!-- armour dark -->
    <linearGradient id="armourDark" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a0aac4"/>
      <stop offset="100%" stop-color="#505870"/>
    </linearGradient>
    <!-- chest gem -->
    <radialGradient id="gem" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c8ddff"/>
      <stop offset="100%" stop-color="#4466cc"/>
    </radialGradient>
    <!-- marking colour: pale icy blue -->
    <!-- body torso -->
    <linearGradient id="bodyZ" x1="0" y1="0" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c8d0e8"/>
      <stop offset="100%" stop-color="#6878a0"/>
    </linearGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="200" height="280" fill="url(#bgz)" rx="14"/>
  <rect width="200" height="280" fill="url(#glowz)" rx="14"/>
  <!-- subtle bg detail lines -->
  <line x1="0"   y1="60"  x2="200" y2="60"  stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0"   y1="120" x2="200" y2="120" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="30"  y1="0"   x2="10"  y2="220" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="170" y1="0"   x2="190" y2="220" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- card border -->
  <rect x="1" y="1" width="198" height="278" fill="none" stroke="#a0b0d0" stroke-opacity="0.50" stroke-width="2" rx="13"/>

  <!-- ── BODY / ARMOUR ── -->
  <!-- torso shape -->
  <path d="M0,220 L0,188 Q18,170 46,162 L76,156 Q88,153 100,153 Q112,153 124,156 L154,162 Q182,170 200,188 L200,220 Z"
        fill="url(#bodyZ)"/>
  <!-- body stripes / markings (pale blue on the white-grey body) -->
  <path d="M60,165 Q68,170 72,185" stroke="#8899cc" stroke-width="5" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M66,160 Q74,165 78,178" stroke="#8899cc" stroke-width="3.5" fill="none" stroke-opacity="0.40" stroke-linecap="round"/>
  <path d="M140,165 Q132,170 128,185" stroke="#8899cc" stroke-width="5" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M134,160 Q126,165 122,178" stroke="#8899cc" stroke-width="3.5" fill="none" stroke-opacity="0.40" stroke-linecap="round"/>
  <!-- centre chest gem -->
  <ellipse cx="100" cy="168" rx="12" ry="10" fill="url(#gem)"/>
  <ellipse cx="100" cy="168" rx="12" ry="10" fill="none" stroke="#c0d0ff" stroke-width="1.2"/>
  <ellipse cx="96"  cy="164" rx="4"  ry="3"  fill="white" fill-opacity="0.55"/>

  <!-- LEFT SHOULDER ARMOUR -->
  <path d="M46,162 Q34,156 28,148 Q36,148 44,152 L52,158 Z" fill="url(#armour)"/>
  <path d="M28,148 Q22,140 26,134 Q32,142 36,148 Z" fill="url(#armourDark)"/>
  <!-- shoulder spike left -->
  <polygon points="28,148 20,136 30,140" fill="#b0bcd4"/>
  <!-- RIGHT SHOULDER ARMOUR -->
  <path d="M154,162 Q166,156 172,148 Q164,148 156,152 L148,158 Z" fill="url(#armour)"/>
  <path d="M172,148 Q178,140 174,134 Q168,142 164,148 Z" fill="url(#armourDark)"/>
  <!-- shoulder spike right -->
  <polygon points="172,148 180,136 170,140" fill="#b0bcd4"/>

  <!-- NECK -->
  <path d="M84,150 Q86,155 86,160 L114,160 Q114,155 116,150 Z" fill="url(#furBase)"/>
  <path d="M84,150 Q83,157 84,160 L86,160 Q86,155 86,150 Z" fill="#a0aac0" fill-opacity="0.40"/>
  <path d="M116,150 Q117,157 116,160 L114,160 Q114,155 114,150 Z" fill="#a0aac0" fill-opacity="0.30"/>

  <!-- ── HEAD (large cat / panther style, white fur) ── -->
  <!-- head shadow ring -->
  <ellipse cx="100" cy="96" rx="56" ry="58" fill="#000018" fill-opacity="0.38"/>
  <!-- main head mass — wide cat head -->
  <ellipse cx="100" cy="93" rx="54" ry="56" fill="url(#furBase)"/>
  <!-- fur highlight -->
  <ellipse cx="100" cy="93" rx="54" ry="56" fill="url(#furLit)"/>
  <!-- side shadow for roundness -->
  <ellipse cx="58"  cy="93" rx="20" ry="52" fill="#8090b0" fill-opacity="0.22"/>
  <ellipse cx="142" cy="93" rx="20" ry="52" fill="#8090b0" fill-opacity="0.16"/>

  <!-- EARS (pointed cat ears on top of head) -->
  <!-- left ear outer -->
  <path d="M58,52 Q48,18 62,10 Q68,28 72,46 Z" fill="url(#furBase)"/>
  <!-- left ear inner (darker pink-ish — pale rose for white cat) -->
  <path d="M60,50 Q52,24 63,16 Q67,30 70,46 Z" fill="#d8a0b0" fill-opacity="0.60"/>
  <!-- right ear outer -->
  <path d="M142,52 Q152,18 138,10 Q132,28 128,46 Z" fill="url(#furBase)"/>
  <!-- right ear inner -->
  <path d="M140,50 Q148,24 137,16 Q133,30 130,46 Z" fill="#d8a0b0" fill-opacity="0.60"/>

  <!-- HEAD MARKINGS — icy blue stripe pattern on white fur -->
  <!-- forehead centre stripe -->
  <path d="M100,42 Q100,55 100,68" stroke="#8899cc" stroke-width="4" fill="none" stroke-opacity="0.50" stroke-linecap="round"/>
  <!-- forehead side stripes left -->
  <path d="M84,46 Q80,58 78,70"  stroke="#8899cc" stroke-width="3" fill="none" stroke-opacity="0.40" stroke-linecap="round"/>
  <path d="M72,52 Q68,62 66,72"  stroke="#8899cc" stroke-width="2.5" fill="none" stroke-opacity="0.32" stroke-linecap="round"/>
  <!-- forehead side stripes right -->
  <path d="M116,46 Q120,58 122,70" stroke="#8899cc" stroke-width="3" fill="none" stroke-opacity="0.40" stroke-linecap="round"/>
  <path d="M128,52 Q132,62 134,72" stroke="#8899cc" stroke-width="2.5" fill="none" stroke-opacity="0.32" stroke-linecap="round"/>
  <!-- cheek stripe left -->
  <path d="M60,95 Q68,100 76,102"  stroke="#8899cc" stroke-width="3" fill="none" stroke-opacity="0.42" stroke-linecap="round"/>
  <path d="M58,106 Q66,110 74,111" stroke="#8899cc" stroke-width="2.5" fill="none" stroke-opacity="0.34" stroke-linecap="round"/>
  <!-- cheek stripe right -->
  <path d="M140,95 Q132,100 124,102"  stroke="#8899cc" stroke-width="3" fill="none" stroke-opacity="0.42" stroke-linecap="round"/>
  <path d="M142,106 Q134,110 126,111" stroke="#8899cc" stroke-width="2.5" fill="none" stroke-opacity="0.34" stroke-linecap="round"/>

  <!-- MUZZLE — protruding snout, slightly darker white -->
  <ellipse cx="100" cy="118" rx="28" ry="20" fill="#dce2f0"/>
  <!-- muzzle centre division -->
  <line x1="100" y1="106" x2="100" y2="126" stroke="#a0aac0" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- nostrils -->
  <ellipse cx="92"  cy="112" rx="3.5" ry="2.5" fill="#8090a8"/>
  <ellipse cx="108" cy="112" rx="3.5" ry="2.5" fill="#8090a8"/>
  <!-- mouth / jaw open showing fangs -->
  <path d="M74,122 Q100,136 126,122 Q120,140 100,144 Q80,140 74,122 Z" fill="#8090a8"/>
  <!-- upper lip edge -->
  <path d="M74,122 Q87,128 100,126 Q113,128 126,122" stroke="#6878a0" stroke-width="1.5" fill="none"/>
  <!-- FANGS (white, prominent) -->
  <polygon points="88,126 84,144 91,126"  fill="white"/>
  <polygon points="112,126 116,144 109,126" fill="white"/>
  <!-- smaller teeth -->
  <polygon points="96,126 94,138 98,126"  fill="white" fill-opacity="0.80"/>
  <polygon points="104,126 102,138 106,126" fill="white" fill-opacity="0.80"/>
  <!-- fang shadow / root -->
  <polygon points="88,126 84,144 91,126"  fill="none" stroke="#c0c8dc" stroke-width="0.8"/>
  <polygon points="112,126 116,144 109,126" fill="none" stroke="#c0c8dc" stroke-width="0.8"/>

  <!-- EYES (fierce, pale gold/amber for a white predator) -->
  <!-- left eye -->
  <ellipse cx="80" cy="86" rx="13" ry="12" fill="#1a1a28"/>
  <ellipse cx="80" cy="87" rx="9"  ry="9"  fill="#d4a030"/>
  <!-- vertical slit pupil like a cat -->
  <ellipse cx="80" cy="87" rx="3"  ry="8"  fill="#0a0808"/>
  <circle  cx="84" cy="83" r="3"   fill="white" fill-opacity="0.85"/>
  <circle  cx="77" cy="90" r="1.5" fill="white" fill-opacity="0.35"/>
  <ellipse cx="80" cy="86" rx="13" ry="12" fill="none" stroke="#505870" stroke-width="1.5"/>
  <!-- eye brow ridge left -->
  <path d="M67,77 Q75,73 90,76" stroke="#7888a8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- right eye -->
  <ellipse cx="120" cy="86" rx="13" ry="12" fill="#1a1a28"/>
  <ellipse cx="120" cy="87" rx="9"  ry="9"  fill="#d4a030"/>
  <ellipse cx="120" cy="87" rx="3"  ry="8"  fill="#0a0808"/>
  <circle  cx="124" cy="83" r="3"   fill="white" fill-opacity="0.85"/>
  <circle  cx="117" cy="90" r="1.5" fill="white" fill-opacity="0.35"/>
  <ellipse cx="120" cy="86" rx="13" ry="12" fill="none" stroke="#505870" stroke-width="1.5"/>
  <!-- eye brow ridge right -->
  <path d="M133,77 Q125,73 110,76" stroke="#7888a8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- ── INFO BAR ── -->
  <rect x="0" y="220" width="200" height="60" fill="#000000" fill-opacity="0.68"/>
  <rect x="0" y="220" width="200" height="3" fill="#a0b8e0" fill-opacity="0.60"/>
  <!-- badge -->
  <rect x="10" y="226" width="54" height="14" fill="#5060a0" fill-opacity="0.30" rx="7"/>
  <text x="37" y="236" font-size="8" text-anchor="middle" fill="#b0c8f0" font-family="sans-serif" font-weight="bold">Dragons Rising</text>
  <!-- name -->
  <text x="100" y="252" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="sans-serif">Zilvar</text>
  <!-- tagline -->
  <text x="100" y="270" font-size="11" text-anchor="middle" fill="#b0c4e8" fill-opacity="0.88" font-family="sans-serif">White Warrior</text>
</svg>
