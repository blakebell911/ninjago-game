<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>
    <linearGradient id="bgz" x1="0" y1="0" x2="0.3" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1a1f40"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a3060" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#05060f" stop-opacity="0"/>
    </radialGradient>
    <!-- head base: off-white with slight warm grey -->
    <linearGradient id="headG" x1="0.2" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f0ece8"/>
      <stop offset="55%" stop-color="#d8d0c8"/>
      <stop offset="100%" stop-color="#a89888"/>
    </linearGradient>
    <radialGradient id="headLit" cx="42%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#e0d8d0" stop-opacity="0"/>
    </radialGradient>
    <!-- mane / textured top -->
    <linearGradient id="maneG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ddd8d0"/>
      <stop offset="100%" stop-color="#b0a898"/>
    </linearGradient>
    <!-- armour steel -->
    <linearGradient id="steelG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#c0c8d4"/>
      <stop offset="100%" stop-color="#606878"/>
    </linearGradient>
    <!-- gold -->
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e8c040"/>
      <stop offset="100%" stop-color="#a06808"/>
    </linearGradient>
    <!-- chest armour plate -->
    <linearGradient id="chestG" x1="0" y1="0" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#9098a8"/>
      <stop offset="100%" stop-color="#404858"/>
    </linearGradient>
  </defs>

  <!-- ── BACKGROUND (night blue, matching show) ── -->
  <rect width="200" height="280" fill="url(#bgz)" rx="14"/>
  <rect width="200" height="280" fill="url(#bgGlow)" rx="14"/>
  <!-- distant light/city glow hints -->
  <ellipse cx="160" cy="195" rx="25" ry="12" fill="#c06020" fill-opacity="0.12"/>
  <ellipse cx="40"  cy="200" rx="18" ry="9"  fill="#c06020" fill-opacity="0.08"/>

  <!-- card border -->
  <rect x="1" y="1" width="198" height="278" fill="none" stroke="#8090b8" stroke-opacity="0.50" stroke-width="2" rx="13"/>

  <!-- ── CAPE (black, behind everything) ── -->
  <path d="M0,220 L0,185 Q15,162 40,155 L70,148 Q85,145 100,145 Q115,145 130,148 L160,155 Q185,162 200,185 L200,220 Z"
        fill="#141418"/>
  <!-- cape fold lines -->
  <path d="M42,158 Q50,170 48,200" stroke="#2a2a32" stroke-width="2" fill="none" stroke-opacity="0.70"/>
  <path d="M158,158 Q150,170 152,200" stroke="#2a2a32" stroke-width="2" fill="none" stroke-opacity="0.70"/>
  <path d="M60,150 Q65,168 62,200" stroke="#2a2a32" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>
  <path d="M140,150 Q135,168 138,200" stroke="#2a2a32" stroke-width="1.5" fill="none" stroke-opacity="0.55"/>

  <!-- ── SHOULDER ARMOUR ── -->
  <!-- left shoulder -->
  <path d="M40,155 Q26,148 20,138 Q28,136 36,142 L48,152 Z" fill="url(#steelG)"/>
  <path d="M20,138 Q14,128 18,120 Q24,130 28,138 Z" fill="#505868"/>
  <circle cx="24" cy="134" r="5" fill="#808898"/>
  <circle cx="24" cy="134" r="3" fill="#606070"/>
  <!-- left shoulder gold bolt -->
  <circle cx="36" cy="142" r="3.5" fill="url(#goldG)"/>
  <!-- right shoulder -->
  <path d="M160,155 Q174,148 180,138 Q172,136 164,142 L152,152 Z" fill="url(#steelG)"/>
  <path d="M180,138 Q186,128 182,120 Q176,130 172,138 Z" fill="#505868"/>
  <circle cx="176" cy="134" r="5" fill="#808898"/>
  <circle cx="176" cy="134" r="3" fill="#606070"/>
  <circle cx="164" cy="142" r="3.5" fill="url(#goldG)"/>

  <!-- ── CHEST ARMOUR PLATE ── -->
  <path d="M70,148 Q78,138 100,135 Q122,138 130,148 L126,168 Q118,162 100,160 Q82,162 74,168 Z"
        fill="url(#chestG)"/>
  <!-- chest plate detail lines -->
  <path d="M84,140 Q100,136 116,140 Q110,148 100,150 Q90,148 84,140 Z" fill="#303848" fill-opacity="0.55"/>
  <!-- gold accents on chest -->
  <polygon points="100,138 96,144 100,148 104,144" fill="url(#goldG)" fill-opacity="0.90"/>
  <polygon points="88,142 85,146 88,150 91,146"    fill="url(#goldG)" fill-opacity="0.70"/>
  <polygon points="112,142 109,146 112,150 115,146" fill="url(#goldG)" fill-opacity="0.70"/>
  <!-- scroll/rune pattern lines on chest -->
  <path d="M82,153 Q100,158 118,153" stroke="#606878" stroke-width="1" fill="none" stroke-opacity="0.60"/>
  <path d="M80,158 Q100,163 120,158" stroke="#606878" stroke-width="0.8" fill="none" stroke-opacity="0.45"/>

  <!-- ── NECK (white, connecting head to armour) ── -->
  <path d="M82,142 Q84,148 84,154 L116,154 Q116,148 118,142 Q109,138 100,137 Q91,138 82,142 Z"
        fill="url(#headG)"/>
  <!-- neck chin-tuft / beard lower extension -->
  <path d="M88,142 Q100,150 112,142 Q106,156 100,158 Q94,156 88,142 Z" fill="#d0c8be" fill-opacity="0.70"/>

  <!-- ── HEAD ── -->
  <!-- head shadow -->
  <ellipse cx="100" cy="88" rx="60" ry="64" fill="#000010" fill-opacity="0.40"/>
  <!-- main head block — wide, squared lion face -->
  <rect x="44" y="34" width="112" height="106" fill="url(#headG)" rx="18"/>
  <rect x="44" y="34" width="112" height="106" fill="url(#headLit)" rx="18"/>
  <!-- side shadows (3-D rounding) -->
  <rect x="44" y="34" width="22" height="106" fill="#a09080" fill-opacity="0.28" rx="18"/>
  <rect x="134" y="34" width="22" height="106" fill="#a09080" fill-opacity="0.20" rx="18"/>
  <!-- bottom chin shadow -->
  <ellipse cx="100" cy="138" rx="38" ry="8" fill="#604820" fill-opacity="0.25"/>

  <!-- ── MANE / CROWN TEXTURE (lumpy top of head, like LEGO lion head piece) ── -->
  <!-- series of raised bumps along crown -->
  <ellipse cx="72"  cy="40" rx="14" ry="10" fill="url(#maneG)"/>
  <ellipse cx="88"  cy="34" rx="13" ry="10" fill="url(#maneG)"/>
  <ellipse cx="100" cy="32" rx="12" ry="10" fill="url(#maneG)"/>
  <ellipse cx="112" cy="34" rx="13" ry="10" fill="url(#maneG)"/>
  <ellipse cx="128" cy="40" rx="14" ry="10" fill="url(#maneG)"/>
  <!-- mane side tufts -->
  <ellipse cx="50"  cy="52" rx="10" ry="14" fill="url(#maneG)"/>
  <ellipse cx="150" cy="52" rx="10" ry="14" fill="url(#maneG)"/>
  <!-- inner mane detail lines for texture -->
  <path d="M72,34 Q72,42 72,50"   stroke="#c0b8ae" stroke-width="1.2" fill="none" stroke-opacity="0.50"/>
  <path d="M88,28 Q88,36 88,46"   stroke="#c0b8ae" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
  <path d="M100,26 Q100,34 100,44" stroke="#c0b8ae" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
  <path d="M112,28 Q112,36 112,46" stroke="#c0b8ae" stroke-width="1.2" fill="none" stroke-opacity="0.45"/>
  <path d="M128,34 Q128,42 128,50" stroke="#c0b8ae" stroke-width="1.2" fill="none" stroke-opacity="0.50"/>

  <!-- ── FLAME MARKINGS on forehead (dark red/crimson) ── -->
  <!-- central flame cluster -->
  <path d="M100,46 Q97,38 100,33 Q103,38 100,46 Z" fill="#7a1010"/>
  <path d="M94,50 Q90,40 93,35 Q96,42 94,50 Z"    fill="#7a1010"/>
  <path d="M106,50 Q110,40 107,35 Q104,42 106,50 Z" fill="#7a1010"/>
  <path d="M88,52 Q84,44 87,40 Q90,46 88,52 Z"     fill="#7a1010" fill-opacity="0.80"/>
  <path d="M112,52 Q116,44 113,40 Q110,46 112,52 Z" fill="#7a1010" fill-opacity="0.80"/>
  <!-- flame tips highlight -->
  <path d="M100,44 Q99,38 100,34 Q101,38 100,44 Z" fill="#c03030" fill-opacity="0.55"/>
  <path d="M94,48 Q92,41 93,37 Q95,42 94,48 Z"    fill="#c03030" fill-opacity="0.40"/>
  <path d="M106,48 Q108,41 107,37 Q105,42 106,48 Z" fill="#c03030" fill-opacity="0.40"/>

  <!-- ── EYE MARKINGS (dark red war-paint slashes) ── -->
  <!-- left eye upper marks -->
  <path d="M64,72 Q70,66 78,68" stroke="#7a1010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M62,79 Q68,74 76,76" stroke="#7a1010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- left lower slash -->
  <path d="M65,88 Q70,84 78,85" stroke="#7a1010" stroke-width="2"   fill="none" stroke-linecap="round"/>
  <!-- right eye upper marks -->
  <path d="M136,72 Q130,66 122,68" stroke="#7a1010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M138,79 Q132,74 124,76" stroke="#7a1010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- right lower slash -->
  <path d="M135,88 Q130,84 122,85" stroke="#7a1010" stroke-width="2"   fill="none" stroke-linecap="round"/>

  <!-- ── EYES (orange-amber, fierce) ── -->
  <!-- left -->
  <ellipse cx="80" cy="80" rx="13" ry="12" fill="#0a0806"/>
  <ellipse cx="80" cy="81" rx="9"  ry="9"  fill="#cc6000"/>
  <ellipse cx="80" cy="81" rx="4"  ry="7"  fill="#060404"/>
  <circle  cx="84" cy="77" r="3"   fill="white" fill-opacity="0.80"/>
  <circle  cx="77" cy="84" r="1.5" fill="white" fill-opacity="0.30"/>
  <ellipse cx="80" cy="80" rx="13" ry="12" fill="none" stroke="#3a2010" stroke-width="1.5"/>
  <!-- right -->
  <ellipse cx="120" cy="80" rx="13" ry="12" fill="#0a0806"/>
  <ellipse cx="120" cy="81" rx="9"  ry="9"  fill="#cc6000"/>
  <ellipse cx="120" cy="81" rx="4"  ry="7"  fill="#060404"/>
  <circle  cx="124" cy="77" r="3"   fill="white" fill-opacity="0.80"/>
  <circle  cx="117" cy="84" r="1.5" fill="white" fill-opacity="0.30"/>
  <ellipse cx="120" cy="80" rx="13" ry="12" fill="none" stroke="#3a2010" stroke-width="1.5"/>

  <!-- ── SNOUT / MUZZLE ── -->
  <!-- wide protruding muzzle -->
  <path d="M72,104 Q100,118 128,104 Q124,128 100,134 Q76,128 72,104 Z" fill="#d4ccc4"/>
  <!-- muzzle centre line -->
  <line x1="100" y1="104" x2="100" y2="122" stroke="#b0a898" stroke-width="1.5" stroke-opacity="0.60"/>
  <!-- nostrils -->
  <ellipse cx="90"  cy="110" rx="4" ry="3" fill="#9a9088"/>
  <ellipse cx="110" cy="110" rx="4" ry="3" fill="#9a9088"/>
  <!-- upper lip edge -->
  <path d="M76,116 Q88,120 100,118 Q112,120 124,116" stroke="#9a9088" stroke-width="1.5" fill="none"/>
  <!-- jaw lower edge -->
  <path d="M76,116 Q100,132 124,116 Q118,134 100,138 Q82,134 76,116 Z" fill="#c0b8b0"/>

  <!-- ── FANGS ── -->
  <polygon points="88,116 83,136 91,117"  fill="#f4f0ec"/>
  <polygon points="94,118 90,136 97,119"  fill="#f0ece8" fill-opacity="0.90"/>
  <polygon points="112,116 117,136 109,117" fill="#f4f0ec"/>
  <polygon points="106,118 110,136 103,119" fill="#f0ece8" fill-opacity="0.90"/>
  <!-- fang shadow line -->
  <line x1="86" y1="116" x2="83" y2="135" stroke="#d0c8c0" stroke-width="0.8"/>
  <line x1="114" y1="116" x2="117" y2="135" stroke="#d0c8c0" stroke-width="0.8"/>

  <!-- CHIN BEARD TUFT -->
  <path d="M88,134 Q94,142 100,144 Q106,142 112,134 Q106,148 100,150 Q94,148 88,134 Z" fill="#d0c8be"/>
  <path d="M94,138 Q100,146 106,138 Q103,150 100,152 Q97,150 94,138 Z" fill="#c0b8ae" fill-opacity="0.60"/>

  <!-- ── INFO BAR ── -->
  <rect x="0" y="220" width="200" height="60" fill="#000000" fill-opacity="0.70"/>
  <rect x="0" y="220" width="200" height="3" fill="#8090b8" fill-opacity="0.65"/>
  <rect x="10" y="226" width="54" height="14" fill="#404868" fill-opacity="0.40" rx="7"/>
  <text x="37" y="236" font-size="8" text-anchor="middle" fill="#a0b0d0" font-family="sans-serif" font-weight="bold">Dragons Rising</text>
  <text x="100" y="252" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="sans-serif">Zilvar</text>
  <text x="100" y="270" font-size="11" text-anchor="middle" fill="#a0b0d0" fill-opacity="0.88" font-family="sans-serif">White Warrior</text>
</svg>
